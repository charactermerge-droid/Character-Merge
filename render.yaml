# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Deploys server/ as a free web service that reads its catalog from the Google Sheet.
# Secrets are never stored here: Render generates two, and asks you for the Google key once.
services:
  - type: web
    name: charactermerge-server
    runtime: node
    plan: free
    region: singapore          # closest Render region to a South Asia audience
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true           # every push to main redeploys
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SHEET_SOURCE
        value: google
      - key: SHEET_ID
        value: 1BwxZy5q79v2PmZ76pL10RY-K5Tbzi5adH3U___6-kNw
      - key: SHEET_REFRESH_SECONDS
        value: "300"
      # Placeholder thumbs/videos ship with the repo (server/local-storage) and are served with signed URLs.
      - key: STORAGE
        value: local
      # PUBLIC_BASE_URL is not needed: the server uses RENDER_EXTERNAL_URL, which Render sets.
      - key: ADMIN_SECRET
        generateValue: true
      - key: LOCAL_SIGNING_SECRET
        generateValue: true
      # The service-account key, pasted once in the dashboard (contents of server/google-sa.json).
      - key: GOOGLE_SA_JSON
        sync: false
